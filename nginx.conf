map $http_user_agent $loggable {
    default 1;
    ~*^kube-probe/ 0;
    ~*UptimeRobot 0;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log main if=$loggable;

    location = /dataset/accident {
        return 307 https://www.kaggle.com/datasets/dodyagung/accident;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
