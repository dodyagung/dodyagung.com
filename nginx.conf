server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /dataset/accident {
        return 307 https://www.kaggle.com/datasets/dodyagung/accident;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
